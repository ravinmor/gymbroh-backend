
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymbase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - net

  server:
    build:
      context: ./gymbroh
    networks:
      - net
    depends_on:
      - db
    environment:
      NODE_ENV: development
    ports:
      - "3333:3333"

volumes:
  pgdata:

networks:
  net:
    driver: bridge
